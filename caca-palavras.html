<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caça-Palavras Mágico 🔍</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .game-container {
            max-width: 800px;
            margin: 80px auto 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        .word-search-grid {
            display: grid;
            gap: 5px;
            margin: 20px auto;
            user-select: none;
            touch-action: none;
            background: var(--lavender-light);
            padding: 10px;
            border-radius: 15px;
            border: 4px solid var(--lavender);
            cursor: pointer;
            width: fit-content;
        }

        .grid-cell {
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--lavender-dark);
            transition: all 0.2s;
            box-shadow: 0 2px 0 var(--lavender-light);
        }

        .grid-cell.selected {
            background: var(--pink-hot);
            color: white;
            transform: scale(1.1);
        }

        .grid-cell.found {
            background: var(--mint);
            color: var(--mint-dark);
        }

        .word-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            padding: 20px;
            background: var(--lavender-light);
            border-radius: 20px;
        }

        .word-item {
            padding: 8px 16px;
            background: white;
            border-radius: 15px;
            font-family: 'Bubblegum Sans', cursive;
            font-size: 1.2rem;
            color: var(--lavender-dark);
            box-shadow: 0 4px 0 var(--lavender);
            transition: all 0.3s;
        }

        .word-item.found {
            background: var(--mint);
            color: white;
            text-decoration: line-through;
            opacity: 0.7;
            box-shadow: none;
            transform: scale(0.95);
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .difficulty-btn {
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            background: white;
            font-family: 'Quicksand', sans-serif;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #ddd;
            transition: all 0.2s;
        }

        .difficulty-btn.active {
            background: var(--pink-hot);
            color: white;
            box-shadow: 0 4px 0 var(--pink-dark);
        }

        @media (max-width: 500px) {
            .grid-cell {
                width: 25px;
                height: 25px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Voltar</a>

    <div class="game-container">
        <h1 class="logo" style="font-size: 3rem; margin-bottom: 20px;">Caça-Palavras 🔍</h1>
        
        <div class="controls">
            <button class="difficulty-btn active" onclick="setDifficulty('Fácil')">Fácil</button>
            <button class="difficulty-btn" onclick="setDifficulty('Médio')">Médio</button>
            <button class="difficulty-btn" onclick="setDifficulty('Difícil')">Difícil</button>
        </div>

        <div id="grid" class="word-search-grid"></div>

        <div id="wordList" class="word-list"></div>

        <div id="winMessage" style="display: none; margin-top: 20px; animation: bounceIn 0.8s;">
            <h2 style="color: var(--pink-hot);">🌟 Incrível! Você encontrou tudo! 🌟</h2>
            <button class="play-btn" onclick="initGame()" style="margin-top: 15px;">Jogar Novamente</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="caca-palavras.js"></script>
</body>
</html>
