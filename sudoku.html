<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Mágico 🔢</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .game-container {
            max-width: 600px;
            margin: 80px auto 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 2px;
            margin: 20px auto;
            background: var(--lavender);
            border: 4px solid var(--lavender-dark);
            width: fit-content;
            padding: 2px;
            border-radius: 10px;
            overflow: hidden;
        }

        .sudoku-cell {
            width: 45px;
            height: 45px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 900;
            cursor: pointer;
            color: var(--text-color);
            transition: all 0.2s;
        }

        /* Thicker borders for 3x3 blocks */
        .sudoku-cell:nth-child(3n) { border-right: 2px solid var(--lavender-dark); }
        .sudoku-cell:nth-child(9n) { border-right: none; }
        .sudoku-cell:nth-child(n+19):nth-child(-n+27),
        .sudoku-cell:nth-child(n+46):nth-child(-n+54) {
            border-bottom: 2px solid var(--lavender-dark);
        }

        .sudoku-cell.fixed {
            background: #f8f0ff;
            color: var(--lavender-dark);
            cursor: default;
        }

        .sudoku-cell.selected {
            background: var(--lavender-light);
            outline: 3px solid var(--pink-hot);
            z-index: 2;
        }

        .sudoku-cell.error {
            background: #ffe0e0;
            color: #ff0000;
        }

        .number-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px auto;
            max-width: 300px;
        }

        .pad-btn {
            padding: 15px;
            background: white;
            border: 3px solid var(--lavender);
            border-radius: 15px;
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--lavender-dark);
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 var(--lavender);
        }

        .pad-btn:hover { background: var(--lavender-light); }
        .pad-btn:active { transform: translateY(4px); box-shadow: none; }
        
        .pad-btn.clear {
            grid-column: span 3;
            background: var(--pink-light);
            border-color: var(--pink-hot);
            color: var(--pink-dark);
            box-shadow: 0 4px 0 var(--pink-hot);
        }

        .controls {
            margin-bottom: 20px;
        }

        @media (max-width: 500px) {
            .sudoku-cell { width: 35px; height: 35px; font-size: 1.2rem; }
            .pad-btn { padding: 10px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Voltar</a>

    <div class="game-container">
        <h1 class="logo" style="font-size: 3rem; margin-bottom: 20px;">Sudoku Mágico 🔢</h1>
        
        <div class="controls">
            <button class="difficulty-btn active" onclick="setDifficulty('Fácil')">Fácil</button>
            <button class="difficulty-btn" onclick="setDifficulty('Médio')">Médio</button>
            <button class="difficulty-btn" onclick="setDifficulty('Difícil')">Difícil</button>
        </div>

        <div id="grid" class="sudoku-grid"></div>

        <div class="number-pad">
            <button class="pad-btn" onclick="inputNumber(1)">1</button>
            <button class="pad-btn" onclick="inputNumber(2)">2</button>
            <button class="pad-btn" onclick="inputNumber(3)">3</button>
            <button class="pad-btn" onclick="inputNumber(4)">4</button>
            <button class="pad-btn" onclick="inputNumber(5)">5</button>
            <button class="pad-btn" onclick="inputNumber(6)">6</button>
            <button class="pad-btn" onclick="inputNumber(7)">7</button>
            <button class="pad-btn" onclick="inputNumber(8)">8</button>
            <button class="pad-btn" onclick="inputNumber(9)">9</button>
            <button class="pad-btn clear" onclick="inputNumber(0)">Limpar</button>
        </div>

        <div id="winMessage" style="display: none; margin-top: 20px; animation: bounceIn 0.8s;">
            <h2 style="color: var(--pink-hot);">🌈 Parabéns! Você completou o Sudoku! 🌈</h2>
            <button class="play-btn" onclick="initGame()" style="margin-top: 15px;">Novo Jogo</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="sudoku.js"></script>
</body>
</html>
