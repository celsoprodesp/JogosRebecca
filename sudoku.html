<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Mágico 🔢</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .game-container {
            max-width: 600px;
            margin: 80px auto 40px;
            padding: 30px;
            background: #ffffff;
            border-radius: 40px;
            text-align: center;
            border: 10px solid #4a0072;
            /* Borda preta sólida e grossa */
        }

        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 4px;
            /* Aumentado para máxima separação */
            margin: 25px auto;
            background: #4a0072;
            border: 6px solid #4a0072;
            width: fit-content;
            padding: 0;
            border-radius: 4px;
            image-rendering: pixelated;
            /* Força nitidez em alguns browsers */
        }

        .sudoku-cell {
            width: 55px;
            height: 55px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 900;
            cursor: pointer;
            color: #000000;
            transition: none;
            border: none;
            /* box-shadow removido */
        }

        .sudoku-cell:nth-child(3n):not(:nth-child(9n)) {
            border-right: 6px solid #4a0072;
        }

        .sudoku-grid>.sudoku-cell:nth-child(n+19):nth-child(-n+27),
        .sudoku-grid>.sudoku-cell:nth-child(n+46):nth-child(-n+54) {
            border-bottom: 6px solid #4a0072;
        }

        .sudoku-cell.fixed {
            background: #eeeeee;
            color: #000000;
            font-weight: 900;
        }

        .sudoku-cell.selected {
            background: #ffffff !important;
            outline: 6px solid #ffff00;
            /* Vermelho choque para máxima visibilidade */
            z-index: 2;
        }

        .sudoku-cell.error {
            background: #ffffff !important;
            color: #ff0000 !important;
        }

        .number-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 30px auto;
            max-width: 320px;
        }

        .pad-btn {
            padding: 20px;
            background: #ffffff;
            border: 5px solid #4a0072;
            border-radius: 12px;
            font-size: 2.8rem;
            font-weight: 950;
            color: #000000;
            cursor: pointer;
            transition: none;
            /* box-shadow removido para nitidez absoluta */
        }

        .pad-btn:hover {
            background: #f0f0f0;
        }

        .pad-btn:active {
            background: #4a0072;
            color: #ffffff;
        }

        .pad-btn.clear {
            grid-column: span 3;
            background: #ffffff;
            border-color: #4a0072;
            color: #000000;
            font-size: 1.8rem;
            text-transform: uppercase;
        }

        .controls {
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .difficulty-btn {
            padding: 10px 20px;
            font-size: 1.1rem;
            font-family: 'Bubblegum Sans', cursive;
            background: white;
            border: 3px solid var(--lavender);
            border-radius: 25px;
            color: var(--lavender-dark);
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 var(--lavender);
        }

        .difficulty-btn:hover {
            background: var(--lavender-light);
        }

        .difficulty-btn.active {
            background: var(--lavender-dark);
            color: white;
            border-color: var(--lavender-dark);
            box-shadow: 0 4px 0 #4a0072;
        }

        @media (max-width: 600px) {
            .game-container {
                margin: 60px 10px 20px;
                padding: 15px;
            }

            .sudoku-cell {
                width: 40px;
                height: 40px;
                font-size: 1.4rem;
            }

            .pad-btn {
                padding: 12px;
                font-size: 1.5rem;
            }

            .difficulty-btn {
                padding: 8px 15px;
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <a href="index.html" class="back-link">← Voltar</a>

    <div class="game-container">
        <h1 class="logo" style="font-size: 3rem; margin-bottom: 20px;">Sudoku Mágico 🔢</h1>

        <div class="controls">
            <button class="difficulty-btn active" onclick="setDifficulty('Fácil')">Fácil</button>
            <button class="difficulty-btn" onclick="setDifficulty('Médio')">Médio</button>
            <button class="difficulty-btn" onclick="setDifficulty('Difícil')">Difícil</button>
        </div>

        <div id="grid" class="sudoku-grid"></div>

        <div class="number-pad">
            <button class="pad-btn" onclick="inputNumber(1)">1</button>
            <button class="pad-btn" onclick="inputNumber(2)">2</button>
            <button class="pad-btn" onclick="inputNumber(3)">3</button>
            <button class="pad-btn" onclick="inputNumber(4)">4</button>
            <button class="pad-btn" onclick="inputNumber(5)">5</button>
            <button class="pad-btn" onclick="inputNumber(6)">6</button>
            <button class="pad-btn" onclick="inputNumber(7)">7</button>
            <button class="pad-btn" onclick="inputNumber(8)">8</button>
            <button class="pad-btn" onclick="inputNumber(9)">9</button>
            <button class="pad-btn clear" onclick="inputNumber(0)">Limpar</button>
        </div>

        <div id="winMessage" style="display: none; margin-top: 20px; animation: bounceIn 0.8s;">
            <h2 style="color: var(--pink-hot);">🌈 Parabéns! Você completou o Sudoku! 🌈</h2>
            <button class="play-btn" onclick="initGame()" style="margin-top: 15px;">Novo Jogo</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="sudoku.js"></script>
</body>

</html>
